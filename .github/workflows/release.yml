name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Run tests
        run: swift test
      - name: Build universal release
        run: scripts/package-release.sh
      - name: Verify architectures and signature
        run: |
          lipo -info "dist/Codex Usage.app/Contents/MacOS/CodexUsageMenubar"
          codesign --verify --deep --strict --verbose=2 "dist/Codex Usage.app"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Codex-Usage-macOS-universal.zip" \
            "dist/Codex-Usage-macOS-universal.zip.sha256" \
            --generate-notes \
            --title "Codex Usage $GITHUB_REF_NAME"
