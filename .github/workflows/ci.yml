name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test
      - name: Build app
        run: scripts/build-app.sh
      - name: Verify signature
        run: codesign --verify --deep --strict --verbose=2 "dist/Codex Usage.app"
